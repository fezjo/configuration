unbind r
bind r source-file ~/.config/tmux/tmux.conf

# prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*:RGB"

set -sg escape-time 10
set -g history-limit 1234567
set -g mouse on

# OSC 52 clipboard
set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# vi copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind -T copy-mode-vi MouseDragEnd1Pane
if-shell "command -v wl-copy >/dev/null 2>&1" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel"

# windows and panes
bind-key c new-window
bind-key b split-window -h
bind-key v split-window -v
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-b split-window -h -c "#{pane_current_path}"
bind -n M-v split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# design
setw -g clock-mode-colour blue
setw -g mode-style 'fg=black bg=green bold'

set -g pane-border-style 'fg=green'
set -g pane-active-border-style 'fg=blue'

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=green'

set -g status-left '#{?client_prefix,#[bg=blue],#[bg=green]}#[fg=black] #S '
set -g status-left-length 10

set -g status-right-style 'fg=black bg=blue'
set -g status-right ' %Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=green bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=blue]#F '

setw -g window-status-bell-style 'fg=blue bg=green bold'

set -g message-style 'fg=blue bg=green bold'
