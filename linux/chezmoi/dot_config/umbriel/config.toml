# Umbriel configuration
#
# Most changes apply when the file is saved.
# Check edits with `umbriel config validate`.
# Complete reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Includes
# https://docs.noctalia.dev/umbriel/configuration/#include
[include]
files = ["shell.toml", "outputs.toml"]

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General
# https://docs.noctalia.dev/umbriel/configuration/#general
[general]
mod_key = "Super"
show_cheatsheet = false

# ==============================================================================
# Environment
# Changes require an Umbriel restart.
# https://docs.noctalia.dev/umbriel/configuration/#environment
[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"

# ==============================================================================
# Lid events
# https://docs.noctalia.dev/umbriel/configuration/#events
[events]
lid_close = "sh -c '$HOME/.local/bin/umbriel-lid close'"
lid_open = "sh -c '$HOME/.local/bin/umbriel-lid open'"

# ==============================================================================
# Screencast
# https://docs.noctalia.dev/umbriel/configuration/#screencast

# ==============================================================================
# Outputs
# https://docs.noctalia.dev/umbriel/outputs/

# ==============================================================================
# Appearance
# https://docs.noctalia.dev/umbriel/appearance/
[appearance]
prefer_no_csd = true
border_width = 4
corner_radius = 12

[appearance.shadow]
enabled = true

[appearance.blur]
radius = 3

[appearance.tab_bar]
hide_when_single = true

# ==============================================================================
# Colors
# https://docs.noctalia.dev/umbriel/appearance/#colors
[colors.border]
focused = "#f5c96bff"

# ==============================================================================
# Effects
# https://docs.noctalia.dev/umbriel/effects/

# ==============================================================================
# Input
# https://docs.noctalia.dev/umbriel/input/
[input.keyboard]
layout = "us-sk_dia"
options = "caps:escape_shifted_capslock,grp:alt_shift_toggle"
numlock_toggle = true

[input.touchpad]
tap = true
disable_while_typing = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"
sensitivity = 0.0

# ==============================================================================
# Layout
# https://docs.noctalia.dev/umbriel/layout/
[layout]
gap = 5
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

[layout.tabs]
middle_click_closes = true

# ==============================================================================
# Window rules
# https://docs.noctalia.dev/umbriel/window-rules/

# Blur all windows.
[[window_rule]]
blur = true

# Float common utility and dialog-style applications.
[[window_rule]]
match.app_id = [
  "^org[.]pulseaudio[.]pavucontrol$",
  "^nm-connection-editor$",
  "^blueman-manager$",
  "^galculator$",
  "^org[.]gnome[.]Calculator$",
  "^it[.]catboy[.]ripdrag$",
]
default_floating = true
default_floating_size = { width = 0.5, height = 0.6 }

# Frame the window being shared; viewers never see the frame.
[[window_rule]]
match.is_cast_target = true
border_color_focused = "#40C057FF"
border_color_unfocused = "#40C057FF"

# Float Noctalia settings.
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

# Float the share picker.
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Float Picture-in-Picture.
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Place Steam notification toasts.
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Layer rules
# https://docs.noctalia.dev/umbriel/layer-rules/

# Noctalia bar, notifications, dock, panels, OSDs, and desktop widgets.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Panels, dock, notifications and OSDs blur live content behind them.
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Overview
# https://docs.noctalia.dev/umbriel/workspaces-overview/
# Hot corners: https://docs.noctalia.dev/umbriel/keybinds/#hot-corners
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

# ==============================================================================
# Animation
# https://docs.noctalia.dev/umbriel/animation/

# ==============================================================================
# Scratchpads
# https://docs.noctalia.dev/umbriel/scratchpads/
