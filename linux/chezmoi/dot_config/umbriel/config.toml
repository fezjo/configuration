"Mod+Shift+WheelDown" = { action = "window-focus-right", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "workspace-move-up", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "workspace-move-down", cooldown_ms = 150 }
"Mod+Alt+WheelUp" = { action = "output-focus-previous", cooldown_ms = 150 }
"Mod+Alt+WheelDown" = { action = "output-focus-next", cooldown_ms = 150 }
"Mod+Alt+Ctrl+WheelUp" = { action = "workspace-move-to-output-previous", cooldown_ms = 150 }
"Mod+Alt+Ctrl+WheelDown" = { action = "workspace-move-to-output-next", cooldown_ms = 150 }

# System
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }

# ==============================================================================
# Layout
# https://docs.noctalia.dev/umbriel/layout/
[layout]
gap = 10
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

[layout.tabs]
middle_click_closes = true

# ==============================================================================
# Window rules
# https://docs.noctalia.dev/umbriel/window-rules/

# Blur all windows.
[[window_rule]]
blur = true

# Float common utility and dialog-style applications.
[[window_rule]]
match.app_id = [
  "^org[.]pulseaudio[.]pavucontrol$",
  "^nm-connection-editor$",
  "^blueman-manager$",
  "^galculator$",
  "^org[.]gnome[.]Calculator$",
  "^it[.]catboy[.]ripdrag$",
]
default_floating = true
default_floating_size = { width = 0.5, height = 0.6 }

# Frame the window being shared; viewers never see the frame.
[[window_rule]]
match.is_cast_target = true
border_color_focused = "#40C057FF"
border_color_unfocused = "#40C057FF"

# Float Noctalia settings.
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

# Float the share picker.
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Float Picture-in-Picture.
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Place Steam notification toasts.
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Layer rules
# https://docs.noctalia.dev/umbriel/layer-rules/

# Noctalia bar, notifications, dock, panels, OSDs, and desktop widgets.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Panels, dock, notifications and OSDs blur live content behind them.
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Overview
# https://docs.noctalia.dev/umbriel/workspaces-overview/
# Hot corners: https://docs.noctalia.dev/umbriel/keybinds/#hot-corners
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

# ==============================================================================
# Animation
# https://docs.noctalia.dev/umbriel/animation/

# ==============================================================================
# Scratchpads
# https://docs.noctalia.dev/umbriel/scratchpads/
