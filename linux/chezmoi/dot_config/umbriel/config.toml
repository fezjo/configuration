# Umbriel configuration
#
# Most changes apply when the file is saved.
# Check edits with `umbriel config validate`.
# Complete reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Includes
# https://docs.noctalia.dev/umbriel/configuration/#include
[include]
files = []

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General
# https://docs.noctalia.dev/umbriel/configuration/#general
[general]
autostart = ["noctalia"]
mod_key = "Super"
show_cheatsheet = false

# ==============================================================================
# Environment
# Changes require an Umbriel restart.
# https://docs.noctalia.dev/umbriel/configuration/#environment
[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"

# ==============================================================================
# Lid events
# https://docs.noctalia.dev/umbriel/configuration/#events
[events]
lid_close = "sh -c '$HOME/.local/bin/umbriel-lid close'"
lid_open = "sh -c '$HOME/.local/bin/umbriel-lid open'"

# ==============================================================================
# Screencast
# https://docs.noctalia.dev/umbriel/configuration/#screencast

# ==============================================================================
# Outputs
# https://docs.noctalia.dev/umbriel/outputs/

# ==============================================================================
# Appearance
# https://docs.noctalia.dev/umbriel/appearance/
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 12

[appearance.shadow]
enabled = true

[appearance.blur]
radius = 3

[appearance.tab_bar]
hide_when_single = true

# ==============================================================================
# Colors
# https://docs.noctalia.dev/umbriel/appearance/#colors
[colors.border]
focused = "#f5c96bff"

# ==============================================================================
# Effects
# https://docs.noctalia.dev/umbriel/effects/

# ==============================================================================
# Input
# https://docs.noctalia.dev/umbriel/input/
[input.keyboard]
layout = "us-sk_dia"
options = "caps:escape_shifted_capslock,grp:alt_shift_toggle"
numlock_toggle = true

[input.touchpad]
tap = true
disable_while_typing = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"
sensitivity = 0.0

[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn ghostty", repeat = false }
"Mod+D" = { action = "overview-toggle", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Q" = { action = "window-kill", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Alt+Return" = { action = "workspace-set-layout toggle", repeat = false }

# Universal copy/paste
"Mod+C" = { action = "spawn $HOME/.local/bin/universal-clipboard copy", repeat = false }
"Mod+V" = { action = "spawn $HOME/.local/bin/universal-clipboard paste", repeat = false }

# Noctalia shell and session
"Mod+Alt+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Alt+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Alt+N" = { action = "spawn noctalia msg panel-toggle notifications", repeat = false }
"Mod+Alt+C" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Alt+S" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Alt+Escape" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Alt+P" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Alt+D" = { action = "workspace-toggle-show-desktop", repeat = false }
"Mod+Alt+A" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }
"Mod+Alt+Shift+A" = { action = "spawn noctalia msg annotate", repeat = false }
"Mod+Alt+O" = { action = "dpms-off", repeat = false }
"Mod+Alt+Shift+O" = { action = "dpms-on", repeat = false }

# Screenshots
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Mod+Print" = { action = "spawn noctalia msg screenshot-window", repeat = false }

# Recent-window switcher
"Alt+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }
"Alt+Shift+Tab" = { action = "spawn noctalia msg window-switcher hold reverse", repeat = false }

# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Alt+grave" = { action = "window-focus-last", repeat = false }
"Mod+grave" = { action = "workspace-focus-last", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Shift+1" = "column-move-to-workspace 1"
"Mod+Shift+2" = "column-move-to-workspace 2"
"Mod+Shift+3" = "column-move-to-workspace 3"
"Mod+Shift+4" = "column-move-to-workspace 4"
"Mod+Shift+5" = "column-move-to-workspace 5"
"Mod+Shift+6" = "column-move-to-workspace 6"
"Mod+Shift+7" = "column-move-to-workspace 7"
"Mod+Shift+8" = "column-move-to-workspace 8"
"Mod+Shift+9" = "column-move-to-workspace 9"
"Mod+Shift+Page_Down" = "column-move-to-workspace-next"
"Mod+Shift+Page_Up" = "column-move-to-workspace-previous"
"Mod+Shift+U" = "column-move-to-workspace-next"
"Mod+Shift+I" = "column-move-to-workspace-previous"
"Mod+Ctrl+Page_Down" = "workspace-move-down"
"Mod+Ctrl+Page_Up" = "workspace-move-up"
"Mod+Ctrl+U" = "workspace-move-down"
"Mod+Ctrl+I" = "workspace-move-up"

# Displays
"Mod+Alt+Left" = "output-focus-left"
"Mod+Alt+Down" = "output-focus-down"
"Mod+Alt+Up" = "output-focus-up"
"Mod+Alt+Right" = "output-focus-right"
"Mod+Alt+H" = "output-focus-left"
"Mod+Alt+J" = "output-focus-down"
"Mod+Alt+K" = "output-focus-up"
"Mod+Alt+L" = "output-focus-right"
"Mod+Alt+Tab" = { action = "scratchpad-focus-next", repeat = false }
"Mod+Alt+Page_Down" = "output-focus-next"
"Mod+Alt+Page_Up" = "output-focus-previous"
"Mod+Alt+U" = "output-focus-next"
"Mod+Alt+I" = "output-focus-previous"
"Mod+Alt+Shift+Left" = "column-move-to-output-left"
"Mod+Alt+Shift+Down" = "column-move-to-output-down"
"Mod+Alt+Shift+Up" = "column-move-to-output-up"
"Mod+Alt+Shift+Right" = "column-move-to-output-right"
"Mod+Alt+Shift+H" = "column-move-to-output-left"
"Mod+Alt+Shift+J" = "column-move-to-output-down"
"Mod+Alt+Shift+K" = "column-move-to-output-up"
"Mod+Alt+Shift+L" = "column-move-to-output-right"
"Mod+Alt+Ctrl+Left" = "workspace-move-to-output-left"
"Mod+Alt+Ctrl+Down" = "workspace-move-to-output-down"
"Mod+Alt+Ctrl+Up" = "workspace-move-to-output-up"
"Mod+Alt+Ctrl+Right" = "workspace-move-to-output-right"
"Mod+Alt+Ctrl+H" = "workspace-move-to-output-left"
"Mod+Alt+Ctrl+J" = "workspace-move-to-output-down"
"Mod+Alt+Ctrl+K" = "workspace-move-to-output-up"
"Mod+Alt+Ctrl+L" = "workspace-move-to-output-right"
"Mod+Alt+Ctrl+Page_Down" = "workspace-move-to-output-next"
"Mod+Alt+Ctrl+Page_Up" = "workspace-move-to-output-previous"
"Mod+Alt+Ctrl+U" = "workspace-move-to-output-next"
"Mod+Alt+Ctrl+I" = "workspace-move-to-output-previous"

# Columns
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+Home" = "column-move-to-first"
"Mod+Shift+End" = "column-move-to-last"
"Mod+Shift+Z" = { action = "column-center", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Shift+W" = { action = "column-toggle-tab-bar", repeat = false }
"Mod+BracketLeft" = "column-focus-tab-previous"
"Mod+BracketRight" = "column-focus-tab-next"
"Mod+Shift+BracketLeft" = "column-move-tab-previous"
"Mod+Shift+BracketRight" = "column-move-tab-next"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-secondary-extent"
"Mod+Minus" = "window-modify-primary-extent -0.02"
"Mod+Equal" = "window-modify-primary-extent +0.02"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.02"
"Mod+Shift+Equal" = "window-modify-secondary-extent +0.02"
"Mod+Comma" = "window-consume-or-expel-left"
"Mod+Period" = "window-consume-or-expel-right"
"Mod+Ctrl+Comma" = "window-consume-left"
"Mod+Ctrl+Period" = "window-consume-right"
"Mod+Shift+Comma" = "window-consume-from-left"
"Mod+Shift+Period" = "window-consume-from-right"

# Window state
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-minimize", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
