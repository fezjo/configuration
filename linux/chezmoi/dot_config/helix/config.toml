# adawaita-dark ayu_dark dracula_at_night github_dark_dimmed molokai new_moon onedark voxed
theme = "new_moon"

[editor]
auto-pairs = false
bufferline = "multiple"
color-modes = true
cursorline = true
# rainbow-brackets = true
rulers = [80, 100]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[keys.normal]
X = "extend_line_above"
D = "delete_char_backward"
C-y = [
  ':sh rm -f /tmp/files2open',
  ':set mouse false',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/files2open',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':redraw',
  ':set mouse true',
  ':open /tmp/files2open',
  'select_all',
  'split_selection_on_newline',
  'goto_file',
]

[keys.normal.space]
q = ":quit"
Q = ":quit!"
z = ":write"
Z = ":write-quit"
