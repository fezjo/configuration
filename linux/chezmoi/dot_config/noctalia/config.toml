[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.4999999888241291
center = [ "clock", "notifications" ]
concave_edge_corners = false
end = [ "media", "tray", "spacer_2", "ram", "cpu", "battery", "network", "volume", "control-center", "session" ]
margin_ends = 0
position = "left"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 160.0
    box_width = 224.0
    cx = 1792.0
    cy = 108.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = true
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        color = "primary"
        color2 = "secondary"
        display = "graph"
        font_family = ""
        gauge_layout = "horizontal"
        highlight_color = "error"
        interface = ""
        label_min_width = 0
        network_speed_compact = false
        network_speed_decimal_places = 1
        network_speed_unit = "auto"
        shadow = true
        show_label = true
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 160.0
    box_width = 224.0
    cx = 1792.0
    cy = 284.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        stat = "ram_pct"
        stat2 = "swap_pct"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 160.0
    box_width = 224.0
    cx = 1792.0
    cy = 460.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        display = "graph"
        stat = "net_rx"
        stat2 = "net_tx"

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 360.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 290.0

[location]
address = "Bratislava"

[lockscreen]
grace_period_seconds = 5
transition = [ "diamond", "disc", "fade", "golden", "honeycomb", "melt", "pixel", "stripes", "vortex", "wipe", "zoom" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 942.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 336.0
    box_width = 640.0
    cx = 960.0
    cy = 188.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        color = "primary"
        format = "{:%H:%M}\\n{:%D}"

[nightlight]
enabled = true

[shell]
screen_time_enabled = true
umbriel_overview_close_on_launch_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.launcher]
    categories = false
    layout = "simple"
    show_app_actions = true

    [shell.panel]
    open_near_click_control_center = true

[theme]
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper.default]
path = "/home/fezjo/Pictures/wallpapers/tatsumaki.jpg"

[wallpaper.last]
path = "/home/fezjo/Pictures/wallpapers/tatsumaki.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/fezjo/Pictures/wallpapers/tatsumaki.jpg"

[widget.spacer_2]
type = "spacer"

[widget.sysmon]
show_cpu_cores = true
